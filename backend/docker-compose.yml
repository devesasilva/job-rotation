
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: job-rotation-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: jobrotation
      RABBITMQ_DEFAULT_PASS: jobrotation123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  rabbitmq_data:
